[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-doc-core"
version = "0.1.0"
description = "Shared foundation contracts for the enterprise document Agent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.5",
  "boto3>=1.40.21",
  "httpx>=0.28.1",
  "langgraph>=1.2.9,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0",
  "opentelemetry-sdk>=1.36.0",
  "pgvector>=0.4.1",
  "prometheus-client>=0.22.1",
  "psycopg[binary,pool]>=3.2.10",
  "pypdf>=6.0.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "python-docx>=1.2.0",
  "redis>=8.0.1,<9",
  "sqlalchemy[asyncio]>=2.0.43",
]

[project.scripts]
enterprise-doc-checkpointer-setup = "enterprise_doc_core.agents.checkpoint:main"
enterprise-doc-embedding-probe = "enterprise_doc_core.documents.embedding_probe:main"
enterprise-doc-reindex-embeddings = "enterprise_doc_core.documents.reindex:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_doc_core"]

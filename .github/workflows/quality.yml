name: Quality

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".trellis/tasks/**/*.json"
      - ".trellis/tasks/**/*.jsonl"
      - ".trellis/spec/**/*.json"
      - ".trellis/spec/**/*.jsonl"
      - ".trellis/workspace/**/*.json"
      - ".trellis/workspace/**/*.jsonl"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".trellis/tasks/**/*.json"
      - ".trellis/tasks/**/*.jsonl"
      - ".trellis/spec/**/*.json"
      - ".trellis/spec/**/*.jsonl"
      - ".trellis/workspace/**/*.json"
      - ".trellis/workspace/**/*.jsonl"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: "5.7.1"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src apps/api/src apps/worker/src apps/mcp/src
      - run: uv run pytest -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

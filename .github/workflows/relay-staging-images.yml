name: Relay Staging Images

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: "Immutable API image reference"
        required: true
        type: string
      worker_image:
        description: "Immutable worker image reference"
        required: true
        type: string
      consumer_image:
        description: "Immutable consumer image reference"
        required: true
        type: string
      web_image:
        description: "Immutable Web image reference"
        required: true
        type: string
      relay_id:
        description: "Operator-selected identifier for the temporary R2 relay objects"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ${{ inputs.api_image }}
          - name: worker
            image: ${{ inputs.worker_image }}
          - name: consumer
            image: ${{ inputs.consumer_image }}
          - name: web
            image: ${{ inputs.web_image }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable image reference
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ matrix.image }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_NAME" | grep -Eq '^(api|worker|consumer|web)$'
          printf '%s' "$IMAGE_REF" | grep -Eq \
            "^ghcr\\.io/drew-z/enterprise-doc-${IMAGE_NAME}@sha256:[0-9a-f]{64}$"

      - name: Export digest-preserving OCI archive
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends skopeo
          fi
          archive="enterprise-doc-${IMAGE_NAME}.oci.tar"
          skopeo copy --all \
            --src-authfile "$HOME/.docker/config.json" \
            "docker://${IMAGE_REF}" \
            "oci-archive:${archive}:enterprise-doc-${IMAGE_NAME}"
          test -s "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          skopeo inspect --raw "oci-archive:${archive}" \
            > "enterprise-doc-${IMAGE_NAME}.oci-index.json"

      - name: Upload OCI archive through temporary R2 relay
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ matrix.image }}
          RELAY_ID: ${{ inputs.relay_id }}
          RELAY_PUT_URLS: ${{ secrets.STAGING_IMAGE_RELAY_PUT_URLS }}
        run: |
          set -euo pipefail
          printf '%s' "$RELAY_ID" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,63}$'
          test -n "$RELAY_PUT_URLS"
          relay_url="$(
            jq -er --arg name "$IMAGE_NAME" '.[$name]' <<< "$RELAY_PUT_URLS"
          )"
          case "$relay_url" in
            https://*.r2.cloudflarestorage.com/*) ;;
            *) echo 'relay URL must target the reviewed R2 S3 endpoint' >&2; exit 1 ;;
          esac
          archive="enterprise-doc-${IMAGE_NAME}.oci.tar"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 900 \
            --retry 10 --retry-delay 2 --retry-all-errors \
            --request PUT --upload-file "$archive" "$relay_url"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          archive_bytes="$(stat -c '%s' "$archive")"
          printf '%s\n' \
            "relay_id=$RELAY_ID" \
            "image_name=$IMAGE_NAME" \
            "image_ref=$IMAGE_REF" \
            "archive_sha256=$archive_sha256" \
            "archive_bytes=$archive_bytes" \
            "receiver_script=scripts/import_staging_oci_archive.py" \
            "receiver_base_name=$RELAY_ID" \
            "receiver_canonical_base=docker.io/library/$RELAY_ID" \
            "receiver_image_reference=$IMAGE_REF" \
            > "enterprise-doc-${IMAGE_NAME}.relay-receipt.txt"

      - name: Upload OCI relay receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-image-relay-receipt-${{ matrix.name }}-${{ github.run_id }}
          path: |
            enterprise-doc-${{ matrix.name }}.oci.tar.sha256
            enterprise-doc-${{ matrix.name }}.oci-index.json
            enterprise-doc-${{ matrix.name }}.relay-receipt.txt
          if-no-files-found: error
          retention-days: 7

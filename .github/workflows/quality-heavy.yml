name: Heavy Quality Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: docker compose -f infra/compose/docker-compose.yml --profile init run --rm minio-init
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/multipart -m integration
      - run: docker compose -f infra/compose/docker-compose.yml down
      - name: Wait for multipart smoke ports to be released
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            if uv run python scripts/multipart_smoke.py --preflight \
              --size-bytes 17825792 --interrupt-after-parts 1; then
              exit 0
            fi
            sleep 2
          done
          echo 'multipart smoke ports were not released within 90 seconds' >&2
          ss -ltnp
          exit 1
      - run: >-
          uv run python scripts/multipart_smoke.py --run
          --size-bytes 17825792 --interrupt-after-parts 1 --measure-api-rss
          --report-path tmp/m1-ci-smoke-report.json
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-integration-report
          path: tmp/m1-ci-smoke-report.json
          if-no-files-found: error
          retention-days: 7

  m4-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: docker compose -f infra/compose/docker-compose.yml --profile init run --rm minio-init
      - run: uv run alembic upgrade head
      - run: uv run enterprise-doc-checkpointer-setup --setup
      - run: uv run enterprise-doc-checkpointer-setup --check
      - run: uv run pytest -m integration -q
      - run: uv run python scripts/evaluate_m4_agent.py
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-results
          path: apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  analysis-rollback-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Verify signed candidate and rollback image identities
        env:
          CANDIDATE_API: ghcr.io/drew-z/enterprise-doc-api@sha256:3bebebab772e7dba738e2a9db029e1855b8c7b23c2ff62a6093612ba15ed9709
          ROLLBACK_API: ghcr.io/drew-z/enterprise-doc-api@sha256:af9e576292ddc5e27c2c2a5704fcd9d3c6f42d07647920ed44b192e5faa39a9c
          ROLLBACK_WORKER: ghcr.io/drew-z/enterprise-doc-worker@sha256:dae34e5b08b94fed54a9455d4ee60230cd512d4751eaaf8caff8bc7d72c6b8a1
          ROLLBACK_CONSUMER: ghcr.io/drew-z/enterprise-doc-consumer@sha256:958ad15ef9227c8198509676074a30d9d71372d02a9abebe3822eea5781f9217
          ROLLBACK_WEB: ghcr.io/drew-z/enterprise-doc-web@sha256:724d1007282607d3d220aae1fbeb76b87a2b48ae4ba0f3a66b95db1aa1297da9
        run: |
          set -euo pipefail
          python scripts/run_analysis_rollback_compatibility.py \
            --candidate-api "$CANDIDATE_API" \
            --rollback-api "$ROLLBACK_API" \
            --rollback-worker "$ROLLBACK_WORKER" \
            --rollback-consumer "$ROLLBACK_CONSUMER" \
            --rollback-web "$ROLLBACK_WEB" \
            --timeout-seconds 180 \
            --report-path "tmp/analysis-rollback-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-rollback-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/analysis-rollback-compatibility-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

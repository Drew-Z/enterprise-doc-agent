name: Heavy Quality Evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all runs the full evidence suite; analysis-runtime only checks signed images"
        required: true
        default: all
        type: choice
        options: [all, analysis-runtime]

permissions:
  contents: read

concurrency:
  group: quality-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m1-integration:
    if: ${{ inputs.scope != 'analysis-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: docker compose -f infra/compose/docker-compose.yml --profile init run --rm minio-init
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/multipart -m integration
      - run: docker compose -f infra/compose/docker-compose.yml down
      - name: Wait for multipart smoke ports to be released
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            if uv run python scripts/multipart_smoke.py --preflight \
              --size-bytes 17825792 --interrupt-after-parts 1; then
              exit 0
            fi
            sleep 2
          done
          echo 'multipart smoke ports were not released within 90 seconds' >&2
          ss -ltnp
          exit 1
      - run: >-
          uv run python scripts/multipart_smoke.py --run
          --size-bytes 17825792 --interrupt-after-parts 1 --measure-api-rss
          --report-path tmp/m1-ci-smoke-report.json
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml down
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-integration-report
          path: tmp/m1-ci-smoke-report.json
          if-no-files-found: error
          retention-days: 7

  m4-integration:
    if: ${{ inputs.scope != 'analysis-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Pull pinned local identity dependencies
        run: |
          uv run python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          import yaml

          services = yaml.safe_load(Path("infra/identity/lab.compose.yaml").read_text())["services"]
          images = sorted({service["image"] for service in services.values()})
          for image in images:
              if not re.fullmatch(r"[a-z0-9./_-]+@sha256:[0-9a-f]{64}", image):
                  raise SystemExit("Identity dependency must be pinned by registry digest")
              subprocess.run(["docker", "pull", "--platform", "linux/amd64", image], check=True, timeout=300)
          PY
      - run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - run: docker compose -f infra/compose/docker-compose.yml --profile init run --rm minio-init
      - run: uv run alembic upgrade head
      - run: uv run enterprise-doc-checkpointer-setup --setup
      - run: uv run enterprise-doc-checkpointer-setup --check
      - run: uv run pytest -m integration -q
      - run: uv run python scripts/evaluate_m4_agent.py
      - if: always()
        run: docker compose -f infra/compose/docker-compose.yml down

  web-e2e:
    if: ${{ inputs.scope != 'analysis-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-results
          path: apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  analysis-rollback-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: candidate-rc56
            api: ghcr.io/drew-z/enterprise-doc-api@sha256:fa97c5c92970f65faf89cf1e3247c22eb8036392a227925158b9d798cb70da94
            worker: ghcr.io/drew-z/enterprise-doc-worker@sha256:5ee1e614a73538ed2fb69b0f06ffc9968cd04603d189d0db6b45e09093b8a000
            consumer: ghcr.io/drew-z/enterprise-doc-consumer@sha256:53a93343e95f216b88848edd3206a5756411015726e5d6ddb0caab4396209652
            web: ghcr.io/drew-z/enterprise-doc-web@sha256:34d37523fc79a5f77823f76a4a101a9ba42dd3e43cb54a0ef7b480c2669073bd
          - runtime: rollback-rc51
            api: ghcr.io/drew-z/enterprise-doc-api@sha256:af9e576292ddc5e27c2c2a5704fcd9d3c6f42d07647920ed44b192e5faa39a9c
            worker: ghcr.io/drew-z/enterprise-doc-worker@sha256:dae34e5b08b94fed54a9455d4ee60230cd512d4751eaaf8caff8bc7d72c6b8a1
            consumer: ghcr.io/drew-z/enterprise-doc-consumer@sha256:958ad15ef9227c8198509676074a30d9d71372d02a9abebe3822eea5781f9217
            web: ghcr.io/drew-z/enterprise-doc-web@sha256:724d1007282607d3d220aae1fbeb76b87a2b48ae4ba0f3a66b95db1aa1297da9
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Login to GHCR for immutable compatibility images
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe signed runtime on schema 0044
        env:
          CANDIDATE_API: ghcr.io/drew-z/enterprise-doc-api@sha256:fa97c5c92970f65faf89cf1e3247c22eb8036392a227925158b9d798cb70da94
          ROLLBACK_API: ${{ matrix.api }}
          ROLLBACK_WORKER: ${{ matrix.worker }}
          ROLLBACK_CONSUMER: ${{ matrix.consumer }}
          ROLLBACK_WEB: ${{ matrix.web }}
        run: |
          set -euo pipefail
          python scripts/run_analysis_rollback_compatibility.py \
            --candidate-api "$CANDIDATE_API" \
            --rollback-api "$ROLLBACK_API" \
            --rollback-worker "$ROLLBACK_WORKER" \
            --rollback-consumer "$ROLLBACK_CONSUMER" \
            --rollback-web "$ROLLBACK_WEB" \
            --expected-schema-head 20261104_0044 \
            --timeout-seconds 180 \
            --report-path "tmp/analysis-rollback-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analysis-rollback-compatibility-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/analysis-rollback-compatibility-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14

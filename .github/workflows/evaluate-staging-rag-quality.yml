name: Evaluate Staging RAG Quality

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "validate-only checks both v2 selections; evaluate calls staging and models"
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - evaluate
      evaluation_scope:
        description: "trial runs the vetted subset; full runs all 40 reviewed v2 cases"
        required: true
        default: trial
        type: choice
        options:
          - trial
          - full
      staging_base_url:
        description: "Externally reachable staging API base URL"
        required: true
        default: https://agent.playlab.eu.cc
        type: string

permissions:
  contents: read

concurrency:
  # Keep quality evaluation out of the deployment and rollback critical section.
  group: enterprise-doc-agent-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize frozen evaluator dependencies
        timeout-minutes: 5
        run: uv sync --frozen --no-dev --python python
      - name: Require clean evaluator checkout
        timeout-minutes: 1
        run: 'test -z "$(git status --porcelain)"'
      - name: Validate twelve-case trial selection
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/evaluate_staging_rag_quality.py \
            --dataset evaluation/rag_quality_v2.json \
            --validate-only --trial-only \
            --report-path "$RUNNER_TEMP/enterprise-doc-rag-validation/rag-validation-trial-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Validate full forty-case selection
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/evaluate_staging_rag_quality.py \
            --dataset evaluation/rag_quality_v2.json \
            --validate-only \
            --report-path "$RUNNER_TEMP/enterprise-doc-rag-validation/rag-validation-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-rag-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/enterprise-doc-rag-validation/rag-validation-trial-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/enterprise-doc-rag-validation/rag-validation-full-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

  evaluate:
    needs: validate
    if: ${{ inputs.execution_mode == 'evaluate' && needs.validate.result == 'success' }}
    # A fresh hosted VM accesses staging through public HTTPS. Only the evaluation
    # step receives the Environment token; no Kubernetes or SSH credentials are used.
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize frozen evaluator dependencies
        timeout-minutes: 5
        run: uv sync --frozen --no-dev --python python
      - name: Require clean evaluator checkout
        timeout-minutes: 1
        run: 'test -z "$(git status --porcelain)"'
      - name: Run authenticated staging RAG quality evaluation
        env:
          EVALUATION_SCOPE: ${{ inputs.evaluation_scope }}
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          STAGING_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_HOST }}
          STAGING_OBJECT_STORE_ALLOWED_HOST: ${{ vars.STAGING_OBJECT_STORE_ALLOWED_HOST }}
          STAGING_SMOKE_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STAGING_BASE_URL"
          test -n "$STAGING_ALLOWED_HOST"
          test -n "$STAGING_OBJECT_STORE_ALLOWED_HOST"
          test -n "$STAGING_SMOKE_TOKEN"
          report_dir="$RUNNER_TEMP/enterprise-doc-rag-quality"
          report="$report_dir/rag-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "$report_dir"
          scope_args=()
          case "$EVALUATION_SCOPE" in
            trial)
              scope_args+=(--trial-only)
              ;;
            full)
              ;;
            *)
              echo 'evaluation_scope must be trial or full' >&2
              exit 2
              ;;
          esac
          uv run --no-sync python scripts/evaluate_staging_rag_quality.py \
            --dataset evaluation/rag_quality_v2.json \
            --base-url "$STAGING_BASE_URL" \
            --allowed-host "$STAGING_ALLOWED_HOST" \
            --allowed-object-store-host "$STAGING_OBJECT_STORE_ALLOWED_HOST" \
            --timeout-seconds 1800 \
            --report-path "$report" \
            "${scope_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-rag-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-doc-rag-quality/rag-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

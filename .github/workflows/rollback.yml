name: Rollback Release

on:
  workflow_dispatch:
    inputs:
      revisions_json:
        description: 'JSON deployment-to-revision map, for example {"enterprise-doc-api":42}'
        required: true
        type: string
      reason:
        description: "Incident or change reason"
        required: true
        type: string
      migration_revision:
        description: "Migration revision reviewed for compatibility"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    # Keep rollback on the same isolated runner as deploy. The K3s API is not
    # exposed to GitHub-hosted runners or the public Internet.
    runs-on: [self-hosted, linux, x64, enterprise-doc-staging]
    environment: staging
    concurrency:
      group: enterprise-doc-agent-staging
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      RUNNER_PYTHON: /opt/enterprise-doc-toolchain/python/bin/python
    steps:
      - name: Validate staging dispatch gate
        env:
          CONTROL_PLANE_APPROVED: ${{ vars.STAGING_CONTROL_PLANE_APPROVED }}
        run: |
          set -euo pipefail
          if test "$CONTROL_PLANE_APPROVED" != "true"; then
            echo 'staging control-plane firewall requires out-of-band approval' >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate pre-provisioned runner toolchain
        run: |
          set -euo pipefail
          test -x "$RUNNER_PYTHON"
          test "$("$RUNNER_PYTHON" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          "$RUNNER_PYTHON" -c 'import cryptography, yaml; assert cryptography.__version__ == "49.0.0"; assert yaml.__version__ == "6.0.3"'
          kubectl version --client
          test "$(kustomize version)" = "v5.7.1"
      - name: Configure cluster credentials
        env:
          KUBECONFIG_SECRET: ${{ secrets.STAGING_KUBECONFIG }}
          EXPECTED_CONTEXT: ${{ vars.STAGING_KUBE_CONTEXT }}
          EXPECTED_API_SERVER: ${{ vars.STAGING_KUBE_API_SERVER }}
          EXPECTED_NAMESPACE_UID: ${{ vars.STAGING_NAMESPACE_UID }}
          NAMESPACE: enterprise-doc-agent-staging
        run: |
          set -euo pipefail
          umask 077
          kubeconfig_path="$RUNNER_TEMP/enterprise-doc-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'KUBECONFIG=%s\n' "$kubeconfig_path" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig_path"
          trap 'rm -f "$KUBECONFIG"' ERR INT TERM
          test -n "$KUBECONFIG_SECRET"
          test -n "$EXPECTED_CONTEXT"
          test -n "$EXPECTED_API_SERVER"
          test -n "$EXPECTED_NAMESPACE_UID"
          printf '%s' "$KUBECONFIG_SECRET" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          actual_context="$(kubectl config current-context)"
          test "$actual_context" = "$EXPECTED_CONTEXT"
          actual_api_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          test "$actual_api_server" = "$EXPECTED_API_SERVER"
          actual_namespace_uid="$(kubectl get namespace "$NAMESPACE" -o jsonpath='{.metadata.uid}')"
          test "$actual_namespace_uid" = "$EXPECTED_NAMESPACE_UID"
          kubectl auth can-i get deployments.apps -n "$NAMESPACE" | grep -qx 'yes'
          kubectl auth can-i patch deployments.apps -n "$NAMESPACE" | grep -qx 'yes'
          kubectl auth can-i watch deployments.apps -n "$NAMESPACE" | grep -qx 'yes'
          if kubectl auth can-i get secrets -n "$NAMESPACE"; then
            echo 'rollback identity must not read Kubernetes Secrets' >&2
            exit 1
          fi
          if kubectl auth can-i create pods -n "$NAMESPACE"; then
            echo 'rollback identity must not create arbitrary Pods' >&2
            exit 1
          fi
          if kubectl auth can-i update configmaps -n "$NAMESPACE"; then
            echo 'rollback identity must not change administrator prerequisites' >&2
            exit 1
          fi
          trap - ERR INT TERM
      - name: Preflight, roll back, and wait
        env:
          NAMESPACE: enterprise-doc-agent-staging
          ROLLBACK_REVISIONS_JSON: ${{ inputs.revisions_json }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          MIGRATION_REVISION: ${{ inputs.migration_revision }}
        run: |
          mkdir -p tmp
          "$RUNNER_PYTHON" scripts/rollback_release.py \
            --namespace "$NAMESPACE" \
            --revisions-json-env ROLLBACK_REVISIONS_JSON \
            --reason "$ROLLBACK_REASON" \
            --migration-revision "$MIGRATION_REVISION" \
            --confirm \
            --record-path "tmp/rollback-${GITHUB_RUN_ID}.json"
          kubectl -n "$NAMESPACE" get deploy -o json > "tmp/rollback-${GITHUB_RUN_ID}.deployments.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rollback-${{ github.run_id }}
          path: tmp/rollback-${{ github.run_id }}.*
          if-no-files-found: warn
      - name: Clean up cluster credentials
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/enterprise-doc-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"

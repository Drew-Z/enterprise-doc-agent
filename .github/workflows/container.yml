name: Container Supply Chain

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      registry:
        description: "Registry host for a manually reviewed tagged run"
        required: false
        default: ""
        type: string
      registry_namespace:
        description: "Registry namespace for a manually reviewed tagged run"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # PR/manual builds remain usable without repository configuration. A tagged
  # release validates that a real HTTPS allowlist was configured first.
  VITE_OBJECT_STORE_ORIGINS: ${{ vars.VITE_OBJECT_STORE_ORIGINS || 'http://127.0.0.1:9000' }}
  CONTAINER_REGISTRY: ${{ inputs.registry || vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  CONTAINER_REGISTRY_NAMESPACE: ${{ inputs.registry_namespace || vars.CONTAINER_REGISTRY_NAMESPACE || github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infra/docker/Dockerfile.api
          - name: worker
            file: infra/docker/Dockerfile.worker
          - name: consumer
            file: infra/docker/Dockerfile.consumer
          - name: web
            file: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve release image prefix
        id: release_ref
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY: ${{ env.CONTAINER_REGISTRY }}
          NAMESPACE: ${{ env.CONTAINER_REGISTRY_NAMESPACE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re

          registry = os.environ["REGISTRY"].strip().lower().rstrip("/")
          namespace = os.environ["NAMESPACE"].strip().strip("/")
          if not re.fullmatch(r"[a-z0-9.-]+(?::[0-9]{1,5})?", registry):
              raise SystemExit("CONTAINER_REGISTRY must be a registry host with optional port")
          try:
              address = ipaddress.ip_address(registry.split(":", 1)[0])
          except ValueError:
              address = None
          if address is not None and address.is_loopback:
              raise SystemExit("CONTAINER_REGISTRY must not target loopback")
          if registry == "localhost":
              raise SystemExit("CONTAINER_REGISTRY must not target localhost")
          parts = namespace.split("/")
          if not parts or any(not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", part) for part in parts):
              raise SystemExit("CONTAINER_REGISTRY_NAMESPACE contains an invalid path segment")
          PY
          printf 'prefix=%s/%s\n' "$REGISTRY" "$NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Validate Web release configuration
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.name == 'web' }}
        env:
          RELEASE_OBJECT_STORE_ORIGINS: ${{ vars.VITE_OBJECT_STORE_ORIGINS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          raw = os.environ.get("RELEASE_OBJECT_STORE_ORIGINS", "")
          origins = [item.strip() for item in raw.split(",") if item.strip()]
          if not origins:
              raise SystemExit("Tagged Web releases require VITE_OBJECT_STORE_ORIGINS")
          for origin in origins:
              parsed = urlsplit(origin)
              exact = f"https://{parsed.netloc}"
              if (
                  parsed.scheme != "https"
                  or parsed.hostname is None
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.path
                  or parsed.query
                  or parsed.fragment
                  or origin != exact
              ):
                  raise SystemExit(f"Web allowlist entry is not an exact HTTPS origin: {origin}")
              host = parsed.hostname.lower()
              if host == "localhost":
                  raise SystemExit("Web allowlist entries must not target localhost")
              try:
                  if ipaddress.ip_address(host).is_loopback:
                      raise SystemExit("Web allowlist entries must not target loopback addresses")
              except ValueError:
                  pass
          PY

      - name: Build image for contract and scan
        id: local_build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_OBJECT_STORE_ORIGINS=${{ env.VITE_OBJECT_STORE_ORIGINS }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan local image
        id: local_scan
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && steps.local_build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate local SBOM
        id: local_sbom
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && steps.local_build.outcome == 'success' }}
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Upload local supply-chain evidence
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.sarif
            sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: warn

      - name: Login to GHCR for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Push immutable release image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_OBJECT_STORE_ORIGINS=${{ env.VITE_OBJECT_STORE_ORIGINS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record immutable image digest
        id: digest
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_REF@$IMAGE_DIGEST" > image-${{ matrix.name }}.digest.txt

      - name: Scan published image
        id: release_scan
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate published SBOM
        id: release_sbom
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' }}
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Extract published BuildKit provenance
        id: provenance
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -uo pipefail
          provenance_status=0
          docker buildx imagetools inspect "$IMAGE_REF@$IMAGE_DIGEST" \
            --format '{{ json .Provenance.SLSA }}' \
            > buildkit-provenance-${{ matrix.name }}.json \
            2> buildkit-provenance-${{ matrix.name }}.log || provenance_status=$?
          if test "$provenance_status" -eq 0; then
            jq -e 'type == "object" and (.buildType | type == "string")' \
              buildkit-provenance-${{ matrix.name }}.json >/dev/null \
              2>> buildkit-provenance-${{ matrix.name }}.log || provenance_status=$?
          fi
          printf 'exit_code=%s\n' "$provenance_status" \
            >> buildkit-provenance-${{ matrix.name }}.log
          exit "$provenance_status"

      - name: Install Cosign
        id: cosign
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' }}
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign and attest immutable digest
        id: sign
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.push.outcome == 'success' && steps.release_scan.outcome == 'success' && steps.release_sbom.outcome == 'success' && steps.provenance.outcome == 'success' && steps.cosign.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -uo pipefail
          IMAGE="$IMAGE_REF@$IMAGE_DIGEST"
          sign_status=0
          : > cosign-sign-attest-${{ matrix.name }}.log
          cosign sign --yes "$IMAGE" \
            >> cosign-sign-attest-${{ matrix.name }}.log 2>&1 || sign_status=1
          cosign attest --yes --type spdxjson \
            --predicate sbom-${{ matrix.name }}.spdx.json "$IMAGE" \
            >> cosign-sign-attest-${{ matrix.name }}.log 2>&1 || sign_status=1
          cosign attest --yes --type slsaprovenance \
            --predicate buildkit-provenance-${{ matrix.name }}.json "$IMAGE" \
            >> cosign-sign-attest-${{ matrix.name }}.log 2>&1 || sign_status=1
          printf 'exit_code=%s\n' "$sign_status" \
            >> cosign-sign-attest-${{ matrix.name }}.log
          exit "$sign_status"

      - name: Verify release attestations
        id: verify
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') && steps.sign.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ steps.release_ref.outputs.prefix }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -uo pipefail
          IMAGE="$IMAGE_REF@$IMAGE_DIGEST"
          verification_status=0
          if cosign verify --output json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/container.yml@.*" \
            "$IMAGE" > cosign-signature-verify-${{ matrix.name }}.json \
            2> cosign-signature-verify-${{ matrix.name }}.log; then
            printf 'exit_code=0\n' >> cosign-signature-verify-${{ matrix.name }}.log
          else
            verify_exit=$?
            printf 'exit_code=%s\n' "$verify_exit" \
              >> cosign-signature-verify-${{ matrix.name }}.log
            verification_status=1
          fi
          if cosign verify-attestation --output json --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/container.yml@.*" \
            "$IMAGE" > cosign-sbom-attestation-verify-${{ matrix.name }}.json \
            2> cosign-sbom-attestation-verify-${{ matrix.name }}.log; then
            printf 'exit_code=0\n' >> cosign-sbom-attestation-verify-${{ matrix.name }}.log
          else
            verify_exit=$?
            printf 'exit_code=%s\n' "$verify_exit" \
              >> cosign-sbom-attestation-verify-${{ matrix.name }}.log
            verification_status=1
          fi
          if cosign verify-attestation --output json --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/container.yml@.*" \
            "$IMAGE" > cosign-provenance-verify-${{ matrix.name }}.json \
            2> cosign-provenance-verify-${{ matrix.name }}.log; then
            printf 'exit_code=0\n' >> cosign-provenance-verify-${{ matrix.name }}.log
          else
            verify_exit=$?
            printf 'exit_code=%s\n' "$verify_exit" \
              >> cosign-provenance-verify-${{ matrix.name }}.log
            verification_status=1
          fi
          exit "$verification_status"

      - name: Record release step outcomes
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        run: |
          printf '%s\n' \
            '{"push":"${{ steps.push.outcome }}","scan":"${{ steps.release_scan.outcome }}","sbom":"${{ steps.release_sbom.outcome }}","provenance":"${{ steps.provenance.outcome }}","sign":"${{ steps.sign.outcome }}","verify":"${{ steps.verify.outcome }}"}' \
            > release-step-outcomes-${{ matrix.name }}.json

      - name: Upload release supply-chain evidence
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-supply-chain-${{ matrix.name }}
          path: |
            image-${{ matrix.name }}.digest.txt
            trivy-${{ matrix.name }}.sarif
            sbom-${{ matrix.name }}.spdx.json
            buildkit-provenance-${{ matrix.name }}.json
            buildkit-provenance-${{ matrix.name }}.log
            cosign-sign-attest-${{ matrix.name }}.log
            cosign-signature-verify-${{ matrix.name }}.json
            cosign-signature-verify-${{ matrix.name }}.log
            cosign-sbom-attestation-verify-${{ matrix.name }}.json
            cosign-sbom-attestation-verify-${{ matrix.name }}.log
            cosign-provenance-verify-${{ matrix.name }}.json
            cosign-provenance-verify-${{ matrix.name }}.log
            release-step-outcomes-${{ matrix.name }}.json
          if-no-files-found: warn

  release-manifest:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download per-image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-supply-chain-*
          path: release-evidence
          merge-multiple: true
      - name: Build strict release manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          python scripts/build_release_manifest.py \
            --evidence-root release-evidence \
            --repository "$RELEASE_REPOSITORY" \
            --ref "$RELEASE_REF" \
            --commit-sha "$RELEASE_COMMIT_SHA" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --workflow-ref "$RELEASE_WORKFLOW_REF" \
            --output release-manifest.json
      - name: Upload strict release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.ref_name }}
          path: release-manifest.json
          if-no-files-found: error

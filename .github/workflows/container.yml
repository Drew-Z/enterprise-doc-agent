name: Container Supply Chain

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: infra/docker/Dockerfile.api
          - name: worker
            file: infra/docker/Dockerfile.worker
          - name: consumer
            file: infra/docker/Dockerfile.consumer
          - name: web
            file: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for contract and scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: enterprise-doc-${{ matrix.name }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.sarif
            sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error
      - name: Login to GHCR for tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable release image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/enterprise-doc-${{ matrix.name }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3.8.2
      - name: Sign and attest immutable digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s\n' "$IMAGE_REF@$IMAGE_DIGEST" > image-${{ matrix.name }}.digest.txt
          cosign sign --yes "$IMAGE_REF@$IMAGE_DIGEST"
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom-${{ matrix.name }}.spdx.json \
            "$IMAGE_REF@$IMAGE_DIGEST"
      - name: Verify keyless signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/enterprise-doc-${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/container.yml@.*" \
            "$IMAGE_REF@$IMAGE_DIGEST"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-digest-${{ matrix.name }}
          path: image-${{ matrix.name }}.digest.txt
          if-no-files-found: error

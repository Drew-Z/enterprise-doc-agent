name: Self-Hosted Quality Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    # Manual fallback only. Keep the fixed repository-scoped label so no other
    # self-hosted runner can receive work intended for the staging node.
    runs-on: [self-hosted, linux, x64, enterprise-doc-staging]
    timeout-minutes: 45
    env:
      CI: "true"
      RUNNER_PYTHON: /opt/enterprise-doc-toolchain/python/bin/python
      RUNNER_UV: /opt/enterprise-doc-toolchain/python/bin/uv
      RUNNER_NODE_BIN: /opt/enterprise-doc-toolchain/node/bin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Validate pre-provisioned quality toolchain
        run: |
          test -x "$RUNNER_PYTHON"
          test "$($RUNNER_PYTHON -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          test "$($RUNNER_UV --version | awk '{print $2}')" = "0.11.3"
          test "$($RUNNER_NODE_BIN/node --version)" = "v24.14.0"
          test "$(PATH="$RUNNER_NODE_BIN:$PATH" $RUNNER_NODE_BIN/pnpm --version)" = "11.9.0"
          printf '%s\n' "$(dirname "$RUNNER_UV")" "$RUNNER_NODE_BIN" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src apps/api/src apps/worker/src apps/mcp/src
      - run: uv run pytest -m "not integration"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

name: Self-Hosted Quality Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    # Manual fallback only. Keep the fixed repository-scoped label so no other
    # self-hosted runner can receive work intended for the staging node.
    runs-on: [self-hosted, linux, x64, enterprise-doc-staging]
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.3"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src apps/api/src apps/worker/src apps/mcp/src
      - run: uv run pytest -m "not integration"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

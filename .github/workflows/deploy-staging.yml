name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      registry_prefix:
        description: "Registry path prefix, for example ghcr.io/org"
        required: true
        type: string
      staging_base_url:
        description: "Externally reachable staging API base URL used by the authenticated smoke"
        required: true
        type: string
      object_store_endpoint:
        description: "Private HTTPS object-store API endpoint used by the workloads"
        required: true
        type: string
      object_store_presign_endpoint:
        description: "Public HTTPS object-store endpoint used by presigned browser uploads"
        required: true
        type: string
      tls_secret_name:
        description: "Pre-provisioned Kubernetes TLS Secret for the staging Ingress"
        required: true
        default: enterprise-doc-staging-tls
        type: string
      api_digest:
        description: "API sha256 digest"
        required: true
        type: string
      worker_digest:
        description: "Worker sha256 digest"
        required: true
        type: string
      consumer_digest:
        description: "Consumer sha256 digest"
        required: true
        type: string
      web_digest:
        description: "Web sha256 digest"
        required: true
        type: string
      run_smoke:
        description: "Run the authenticated staging smoke after rollout"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    # The Kubernetes API is intentionally private. This job must run only on the
    # dedicated, repository-scoped staging runner installed on the cluster node;
    # a generic self-hosted label would allow unrelated jobs onto that host.
    runs-on: [self-hosted, linux, x64, enterprise-doc-staging]
    environment: staging
    concurrency:
      group: enterprise-doc-agent-staging
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      RUNNER_PYTHON: /opt/enterprise-doc-toolchain/python/bin/python
    defaults:
      run:
        working-directory: repository
    steps:
      - name: Validate staging dispatch gate
        working-directory: ${{ github.workspace }}
        env:
          CONTROL_PLANE_APPROVED: ${{ vars.STAGING_CONTROL_PLANE_APPROVED }}
        run: |
          set -euo pipefail
          if test "$CONTROL_PLANE_APPROVED" != "true"; then
            echo 'staging control-plane firewall requires out-of-band approval' >&2
            exit 1
          fi
      - name: Download exact source archive
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          repo_dir="$GITHUB_WORKSPACE/repository"
          staging_dir="$GITHUB_WORKSPACE/.repository-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$RUNNER_TEMP/enterprise-doc-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          curl_config="$RUNNER_TEMP/enterprise-doc-curl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.conf"
          case "$repo_dir" in
            "$GITHUB_WORKSPACE/repository") ;;
            *) echo 'refusing to replace an unexpected runner path' >&2; exit 1 ;;
          esac
          cleanup() {
            rm -f -- "$archive" "$curl_config"
            rm -rf -- "$staging_dir"
          }
          trap cleanup EXIT INT TERM
          rm -rf -- "$repo_dir" "$staging_dir"
          mkdir -p "$staging_dir"
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$curl_config"
          chmod 600 "$curl_config"
          curl --config "$curl_config" \
            --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 240 \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "$archive"
          tar -xzf "$archive" --strip-components=1 -C "$staging_dir"
          test -f "$staging_dir/.github/workflows/deploy-staging.yml"
          mv "$staging_dir" "$repo_dir"
          trap - EXIT INT TERM
          rm -f -- "$archive" "$curl_config"
      - name: Validate pre-provisioned runner toolchain
        run: |
          set -euo pipefail
          test -x "$RUNNER_PYTHON"
          test "$("$RUNNER_PYTHON" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          "$RUNNER_PYTHON" -c 'import cryptography, yaml; assert cryptography.__version__ == "50.0.0"; assert yaml.__version__ == "6.0.3"'
          kubectl version --client
          test "$(kustomize version)" = "v5.7.1"
      - name: Configure cluster credentials
        env:
          KUBECONFIG_SECRET: ${{ secrets.STAGING_KUBECONFIG }}
          EXPECTED_CONTEXT: ${{ vars.STAGING_KUBE_CONTEXT }}
          EXPECTED_API_SERVER: ${{ vars.STAGING_KUBE_API_SERVER }}
          EXPECTED_NAMESPACE_UID: ${{ vars.STAGING_NAMESPACE_UID }}
          NAMESPACE: enterprise-doc-agent-staging
        run: |
          set -euo pipefail
          umask 077
          kubeconfig_path="$RUNNER_TEMP/enterprise-doc-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'KUBECONFIG=%s\n' "$kubeconfig_path" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig_path"
          trap 'rm -f "$KUBECONFIG"' ERR INT TERM
          test -n "$KUBECONFIG_SECRET"
          test -n "$EXPECTED_CONTEXT"
          test -n "$EXPECTED_API_SERVER"
          test -n "$EXPECTED_NAMESPACE_UID"
          printf '%s' "$KUBECONFIG_SECRET" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          actual_context="$(kubectl config current-context)"
          test "$actual_context" = "$EXPECTED_CONTEXT"
          actual_api_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          test "$actual_api_server" = "$EXPECTED_API_SERVER"
          actual_namespace_uid="$(kubectl get namespace "$NAMESPACE" -o jsonpath='{.metadata.uid}')"
          test "$actual_namespace_uid" = "$EXPECTED_NAMESPACE_UID"
          kubectl auth can-i get namespace/enterprise-doc-agent-staging | grep -qx 'yes'
          if kubectl auth can-i get secrets -n enterprise-doc-agent-staging; then
            echo 'staging deployer must not read Kubernetes Secrets' >&2
            exit 1
          fi
          if kubectl auth can-i create pods -n enterprise-doc-agent-staging; then
            echo 'staging deployer must not create arbitrary Pods' >&2
            exit 1
          fi
          if kubectl auth can-i update configmaps -n enterprise-doc-agent-staging; then
            echo 'staging prerequisites must remain administrator-owned' >&2
            exit 1
          fi
          if kubectl auth can-i patch networkpolicies.networking.k8s.io \
            -n enterprise-doc-agent-staging; then
            echo 'staging deployer must not change NetworkPolicy' >&2
            exit 1
          fi
          if kubectl auth can-i patch persistentvolumeclaims \
            -n enterprise-doc-agent-staging; then
            echo 'staging deployer must not change persistent storage' >&2
            exit 1
          fi
          kubectl auth can-i create jobs.batch -n enterprise-doc-agent-staging | grep -qx 'yes'
          kubectl auth can-i patch deployments.apps -n enterprise-doc-agent-staging | grep -qx 'yes'
          kubectl auth can-i patch deployments.apps/scale -n enterprise-doc-agent-staging | grep -qx 'yes'
          trap - ERR INT TERM
      - name: Validate deployment profile ownership
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_PROFILE" in
            tiny-single-node|single-node-4c4g|single-node-4c8g|staging) ;;
            *) echo 'unsupported deployment profile' >&2; exit 1 ;;
          esac
          namespace_json="$(
            kubectl get namespace enterprise-doc-agent-staging --ignore-not-found -o json
          )"
          if test -z "$namespace_json"; then
            exit 0
          fi
          actual_profile="$(
            printf '%s' "$namespace_json" | "$RUNNER_PYTHON" -c \
              'import json, sys; print(json.load(sys.stdin).get("metadata", {}).get("annotations", {}).get("enterprise-doc-agent/deployment-profile", ""))'
          )"
          if test -z "$actual_profile"; then
            echo 'existing namespace is missing its deployment profile annotation' >&2
            exit 1
          fi
          if test "$actual_profile" != "$DEPLOYMENT_PROFILE"; then
            echo "existing namespace belongs to deployment profile: $actual_profile" >&2
            exit 1
          fi
      - name: Bind exact image digests
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
          REGISTRY_PREFIX: ${{ inputs.registry_prefix }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
          CONSUMER_DIGEST: ${{ inputs.consumer_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_PROFILE" in
            tiny-single-node|single-node-4c4g|single-node-4c8g|staging) ;;
            *) echo 'unsupported deployment profile' >&2; exit 1 ;;
          esac
          # Reviewed single-node profiles inherit the staging image transformer.
          # Bind the parent before rendering a child profile so Kustomize still
          # matches the logical enterprise-doc/* image names.
          IMAGE_BINDING_OVERLAY="infra/k8s/overlays/staging"
          printf '%s' "$REGISTRY_PREFIX" | grep -Eq '^[a-z0-9.-]+(:[0-9]{1,5})?(/[a-z0-9][a-z0-9._-]*)+$'
          case "$REGISTRY_PREFIX" in
            localhost*|127.*|\[::1\]*) echo 'registry_prefix must not target loopback' >&2; exit 1 ;;
          esac
          for digest in "$API_DIGEST" "$WORKER_DIGEST" "$CONSUMER_DIGEST" "$WEB_DIGEST"; do
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          cd "$IMAGE_BINDING_OVERLAY"
          kustomize edit set image enterprise-doc/api="$REGISTRY_PREFIX/enterprise-doc-api@$API_DIGEST"
          kustomize edit set image enterprise-doc/worker="$REGISTRY_PREFIX/enterprise-doc-worker@$WORKER_DIGEST"
          kustomize edit set image enterprise-doc/consumer="$REGISTRY_PREFIX/enterprise-doc-consumer@$CONSUMER_DIGEST"
          kustomize edit set image enterprise-doc/web="$REGISTRY_PREFIX/enterprise-doc-web@$WEB_DIGEST"
      - name: Render and validate staging manifests
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          OBJECT_STORE_ENDPOINT: ${{ inputs.object_store_endpoint }}
          OBJECT_STORE_PRESIGN_ENDPOINT: ${{ inputs.object_store_presign_endpoint }}
          OBJECT_STORE_CHECKSUM_MODE: ${{ vars.STAGING_OBJECT_STORE_CHECKSUM_MODE }}
          TLS_SECRET_NAME: ${{ inputs.tls_secret_name }}
          VITE_OBJECT_STORE_ORIGINS: ${{ vars.VITE_OBJECT_STORE_ORIGINS }}
          DATABASE_EGRESS_CIDR: ${{ vars.STAGING_DATABASE_EGRESS_CIDRS || vars.STAGING_DATABASE_EGRESS_CIDR }}
          MODEL_PROVIDER: openai_compatible
          MODEL_BASE_URL: ${{ vars.STAGING_MODEL_BASE_URL }}
          MODEL_NAME: ${{ vars.STAGING_MODEL_NAME }}
          MODEL_FALLBACK_BASE_URL: ${{ vars.STAGING_MODEL_FALLBACK_BASE_URL }}
          MODEL_FALLBACK_NAME: ${{ vars.STAGING_MODEL_FALLBACK_NAME }}
          MODEL_FALLBACK_VERSION: ${{ vars.STAGING_MODEL_FALLBACK_VERSION }}
          MODEL_FALLBACK_TIMEOUT_SECONDS: ${{ vars.STAGING_MODEL_FALLBACK_TIMEOUT_SECONDS || '60' }}
          EMBEDDING_BASE_URL: ${{ vars.STAGING_EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL_NAME: ${{ vars.STAGING_EMBEDDING_MODEL_NAME }}
          EMBEDDING_VERSION: ${{ vars.STAGING_EMBEDDING_VERSION || '2' }}
          ROLLBACK_API_IMAGE: ${{ vars.STAGING_ROLLBACK_API_IMAGE }}
          ROLLBACK_WORKER_IMAGE: ${{ vars.STAGING_ROLLBACK_WORKER_IMAGE }}
          ROLLBACK_CONSUMER_IMAGE: ${{ vars.STAGING_ROLLBACK_CONSUMER_IMAGE }}
          ROLLBACK_WEB_IMAGE: ${{ vars.STAGING_ROLLBACK_WEB_IMAGE }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_PROFILE" in
            tiny-single-node|single-node-4c4g|single-node-4c8g|staging) ;;
            *) echo 'unsupported deployment profile' >&2; exit 1 ;;
          esac
          OVERLAY_DIR="infra/k8s/overlays/${DEPLOYMENT_PROFILE}"
          test -n "$VITE_OBJECT_STORE_ORIGINS"
          test -n "$OBJECT_STORE_CHECKSUM_MODE"
          test -n "$MODEL_BASE_URL"
          test -n "$MODEL_NAME"
          test -n "$EMBEDDING_BASE_URL"
          test -n "$EMBEDDING_MODEL_NAME"
          test -n "$EMBEDDING_VERSION"
          fallback_args=()
          if test -n "$MODEL_FALLBACK_BASE_URL" || test -n "$MODEL_FALLBACK_NAME"; then
            if test -z "$MODEL_FALLBACK_BASE_URL" || test -z "$MODEL_FALLBACK_NAME"; then
              echo 'fallback model route requires both a base URL and a model name' >&2
              exit 1
            fi
            test -n "$MODEL_FALLBACK_TIMEOUT_SECONDS"
            fallback_args+=(
              --fallback-model-base-url "$MODEL_FALLBACK_BASE_URL"
              --fallback-model-name "$MODEL_FALLBACK_NAME"
              --fallback-model-timeout-seconds "$MODEL_FALLBACK_TIMEOUT_SECONDS"
            )
            if test -n "$MODEL_FALLBACK_VERSION"; then
              fallback_args+=(--fallback-model-version "$MODEL_FALLBACK_VERSION")
            fi
          elif test -n "$MODEL_FALLBACK_VERSION"; then
            echo 'fallback model version requires a configured fallback route' >&2
            exit 1
          fi
          kustomize build "$OVERLAY_DIR" > "$RUNNER_TEMP/staging-template.yaml"
          "$RUNNER_PYTHON" scripts/configure_staging_manifest.py \
            --input "$RUNNER_TEMP/staging-template.yaml" \
            --output "$RUNNER_TEMP/staging.yaml" \
            --staging-base-url "$STAGING_BASE_URL" \
            --object-store-endpoint "$OBJECT_STORE_ENDPOINT" \
            --object-store-presign-endpoint "$OBJECT_STORE_PRESIGN_ENDPOINT" \
            --object-store-checksum-mode "$OBJECT_STORE_CHECKSUM_MODE" \
            --tls-secret-name "$TLS_SECRET_NAME" \
            --web-object-store-origins "$VITE_OBJECT_STORE_ORIGINS" \
            --database-egress-cidr "$DATABASE_EGRESS_CIDR" \
            --model-provider "$MODEL_PROVIDER" \
            --model-base-url "$MODEL_BASE_URL" \
            --model-name "$MODEL_NAME" \
            --embedding-base-url "$EMBEDDING_BASE_URL" \
            --embedding-model-name "$EMBEDDING_MODEL_NAME" \
            --embedding-version "$EMBEDDING_VERSION" \
            "${fallback_args[@]}" \
            --rollback-api-image "$ROLLBACK_API_IMAGE" \
            --rollback-worker-image "$ROLLBACK_WORKER_IMAGE" \
            --rollback-consumer-image "$ROLLBACK_CONSUMER_IMAGE" \
            --rollback-web-image "$ROLLBACK_WEB_IMAGE"
          "$RUNNER_PYTHON" - "$RUNNER_TEMP/staging.yaml" <<'PY'
          from pathlib import Path
          import sys

          import yaml

          documents = [
              item
              for item in yaml.safe_load_all(Path(sys.argv[1]).read_text(encoding="utf-8"))
              if isinstance(item, dict)
          ]

          def has_resource(kind: str, name: str | None = None) -> bool:
              return any(
                  item.get("kind") == kind
                  and (name is None or item.get("metadata", {}).get("name") == name)
                  for item in documents
              )

          required = (
              ("Namespace", "enterprise-doc-agent-staging"),
              ("Job", "enterprise-doc-migrate"),
              ("Job", "enterprise-doc-embedding-rollout"),
              ("Ingress", None),
          )
          for kind, name in required:
              if not has_resource(kind, name):
                  raise SystemExit(f"rendered manifest is missing required {kind}: {name or '*'}")
          for item in documents:
              if item.get("kind") == "ConfigMap" and "DATABASE__URL" in item.get("data", {}):
                  raise SystemExit("DATABASE__URL must come only from enterprise-doc-secrets")
          PY
          "$RUNNER_PYTHON" scripts/render_k8s_phase.py --input "$RUNNER_TEMP/staging.yaml" --phase prerequisites --output "$RUNNER_TEMP/staging-prerequisites.yaml"
          "$RUNNER_PYTHON" scripts/render_k8s_phase.py --input "$RUNNER_TEMP/staging.yaml" --phase migration --output "$RUNNER_TEMP/staging-migration.yaml"
          "$RUNNER_PYTHON" scripts/render_k8s_phase.py --input "$RUNNER_TEMP/staging.yaml" --phase embedding-rollout --output "$RUNNER_TEMP/staging-embedding-rollout.yaml"
          "$RUNNER_PYTHON" scripts/render_k8s_phase.py --input "$RUNNER_TEMP/staging.yaml" --phase workloads --output "$RUNNER_TEMP/staging-workloads.yaml"
      - name: Verify administrator-owned staging prerequisites
        id: prerequisites
        run: |
          set -euo pipefail
          kubectl get namespace enterprise-doc-agent-staging -o yaml \
            > "$RUNNER_TEMP/staging-prerequisites-live.yaml"
          printf '\n---\n' >> "$RUNNER_TEMP/staging-prerequisites-live.yaml"
          kubectl -n enterprise-doc-agent-staging get \
            configmaps,persistentvolumeclaims,serviceaccounts,services,poddisruptionbudgets.policy,ingresses.networking.k8s.io,networkpolicies.networking.k8s.io \
            -o yaml >> "$RUNNER_TEMP/staging-prerequisites-live.yaml"
          kubectl get namespace enterprise-doc-agent-staging -o json \
            > "$RUNNER_TEMP/staging-namespace.json"
          "$RUNNER_PYTHON" scripts/validate_staging_prerequisites.py \
            --expected-manifest "$RUNNER_TEMP/staging-prerequisites.yaml" \
            --live-manifest "$RUNNER_TEMP/staging-prerequisites-live.yaml" \
            --live-namespace-json "$RUNNER_TEMP/staging-namespace.json"
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/staging-workloads.yaml"
      - name: Apply migration job before rollout
        id: migration
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
        run: |
          set -euo pipefail
          if test "$DEPLOYMENT_PROFILE" = "tiny-single-node" || test "$DEPLOYMENT_PROFILE" = "single-node-4c4g"; then
            kubectl -n enterprise-doc-agent-staging scale \
              deployment/enterprise-doc-api \
              deployment/enterprise-doc-worker \
              deployment/enterprise-doc-consumer \
              deployment/enterprise-doc-web --replicas=0
          fi
          if kubectl -n enterprise-doc-agent-staging get job enterprise-doc-migrate >/dev/null 2>&1; then
            previous_complete="$(kubectl -n enterprise-doc-agent-staging get job enterprise-doc-migrate \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')"
            if test "$previous_complete" != "True"; then
              echo 'previous migration Job is not complete; preserve it for operator review' >&2
              exit 1
            fi
          fi
          kubectl -n enterprise-doc-agent-staging delete job enterprise-doc-migrate --ignore-not-found
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/staging-migration.yaml"
          kubectl apply -f "$RUNNER_TEMP/staging-migration.yaml"
          migration_result=""
          for ((attempt = 0; attempt < 552; attempt += 1)); do
            complete="$(kubectl -n enterprise-doc-agent-staging get \
              job/enterprise-doc-migrate \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' \
              2>/dev/null || true)"
            failed="$(kubectl -n enterprise-doc-agent-staging get \
              job/enterprise-doc-migrate \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' \
              2>/dev/null || true)"
            if (( attempt % 12 == 0 )); then
              echo "migration Job status after $((attempt * 5)) seconds"
              kubectl -n enterprise-doc-agent-staging get \
                job/enterprise-doc-migrate -o wide || true
              kubectl -n enterprise-doc-agent-staging get pods \
                -l job-name=enterprise-doc-migrate -o wide || true
            fi
            if test "$complete" = "True"; then
              migration_result="complete"
              break
            fi
            if test "$failed" = "True"; then
              migration_result="failed"
              break
            fi
            sleep 5
          done
          if test "$migration_result" != "complete"; then
            echo "migration Job did not complete: ${migration_result:-timeout}" >&2
            kubectl -n enterprise-doc-agent-staging get job/enterprise-doc-migrate -o wide || true
            kubectl -n enterprise-doc-agent-staging get pods \
              -l job-name=enterprise-doc-migrate -o wide || true
            kubectl -n enterprise-doc-agent-staging describe job/enterprise-doc-migrate || true
            kubectl -n enterprise-doc-agent-staging describe pods \
              -l job-name=enterprise-doc-migrate || true
            kubectl -n enterprise-doc-agent-staging get events \
              --field-selector involvedObject.name=enterprise-doc-migrate \
              --sort-by=.lastTimestamp || true
            exit 1
          fi
      - name: Apply workloads after migration
        id: workloads
        run: |
          set -euo pipefail
          kubectl apply -f "$RUNNER_TEMP/staging-workloads.yaml"
      - name: Wait for workloads
        id: rollout
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
        run: |
          set -euo pipefail
          worker_timeout=600s
          if test "$DEPLOYMENT_PROFILE" = "single-node-4c4g"; then
            worker_timeout=1800s
          fi
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-api --timeout=600s
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-worker --timeout="$worker_timeout"
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-consumer --timeout=600s
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-web --timeout=600s
          if kubectl -n enterprise-doc-agent-staging get deployment enterprise-doc-redis >/dev/null 2>&1; then
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-redis --timeout=180s
          fi
          if kubectl -n enterprise-doc-agent-staging get deployment enterprise-doc-prometheus >/dev/null 2>&1; then
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-prometheus --timeout=300s
          fi
      - name: Run embedding provider and reindex gate
        id: embedding_rollout
        env:
          EXPECTED_EMBEDDING_MODEL: ${{ vars.STAGING_EMBEDDING_MODEL_NAME }}
          EXPECTED_EMBEDDING_VERSION: ${{ vars.STAGING_EMBEDDING_VERSION || '2' }}
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/staging-embedding-rollout.json"
          restore_workloads() {
            if test "${DEPLOYMENT_PROFILE:-}" != "tiny-single-node" && test "${DEPLOYMENT_PROFILE:-}" != "single-node-4c4g"; then
              return 0
            fi
            worker_timeout=600s
            if test "$DEPLOYMENT_PROFILE" = "single-node-4c4g"; then
              worker_timeout=1800s
            fi
            kubectl apply -f "$RUNNER_TEMP/staging-workloads.yaml" >/dev/null
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-api --timeout=600s
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-worker --timeout="$worker_timeout"
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-consumer --timeout=600s
            kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-web --timeout=600s
          }
          if test "${DEPLOYMENT_PROFILE:-}" = "tiny-single-node" || test "${DEPLOYMENT_PROFILE:-}" = "single-node-4c4g"; then
            trap 'restore_workloads' EXIT
            if test "${DEPLOYMENT_PROFILE:-}" = "single-node-4c4g"; then
              # Keep the queue publisher and consumer available while the
              # embedding reindex Job drains the work they produce. API and
              # Web are not needed by this gate and can be paused to reduce
              # pressure on the small single-node staging host.
              kubectl -n enterprise-doc-agent-staging scale \
                deployment/enterprise-doc-api \
                deployment/enterprise-doc-web --replicas=0
              kubectl -n enterprise-doc-agent-staging scale \
                deployment/enterprise-doc-consumer --replicas=4
              kubectl -n enterprise-doc-agent-staging rollout status \
                deployment/enterprise-doc-consumer --timeout=180s
              selector='app.kubernetes.io/name in (enterprise-doc-api,enterprise-doc-web)'
            else
              # The tiny profile cannot sustain the queue workers alongside
              # the reindex Job, so preserve its original all-workload pause.
              kubectl -n enterprise-doc-agent-staging scale \
                deployment/enterprise-doc-api \
                deployment/enterprise-doc-worker \
                deployment/enterprise-doc-consumer \
                deployment/enterprise-doc-web --replicas=0
              selector='app.kubernetes.io/name in (enterprise-doc-api,enterprise-doc-worker,enterprise-doc-consumer,enterprise-doc-web)'
            fi
            for ((attempt = 0; attempt < 60; attempt += 1)); do
              remaining="$(kubectl -n enterprise-doc-agent-staging get pods \
                -l "$selector" \
                --no-headers 2>/dev/null | awk 'NF { count += 1 } END { print count + 0 }')"
              if test "$remaining" = "0"; then
                break
              fi
              sleep 2
            done
          fi
          if kubectl -n enterprise-doc-agent-staging get job enterprise-doc-embedding-rollout >/dev/null 2>&1; then
            previous_complete="$(kubectl -n enterprise-doc-agent-staging get job enterprise-doc-embedding-rollout \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')"
            if test "$previous_complete" != "True"; then
              echo 'previous embedding rollout Job is not complete; preserve it for operator review' >&2
              exit 1
            fi
          fi
          kubectl -n enterprise-doc-agent-staging delete job enterprise-doc-embedding-rollout \
            --ignore-not-found --wait=true
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/staging-embedding-rollout.yaml"
          kubectl apply -f "$RUNNER_TEMP/staging-embedding-rollout.yaml"
          job_result=""
          for ((attempt = 0; attempt < 660; attempt += 1)); do
            complete="$(kubectl -n enterprise-doc-agent-staging get \
              job/enterprise-doc-embedding-rollout \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' \
              2>/dev/null || true)"
            failed="$(kubectl -n enterprise-doc-agent-staging get \
              job/enterprise-doc-embedding-rollout \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' \
              2>/dev/null || true)"
            if test "$complete" = "True"; then
              job_result="complete"
              break
            fi
            if test "$failed" = "True"; then
              job_result="failed"
              break
            fi
            sleep 5
          done
          if test "$job_result" != "complete"; then
            kubectl -n enterprise-doc-agent-staging logs job/enterprise-doc-embedding-rollout \
              > "$report" 2>/dev/null || true
            kubectl -n enterprise-doc-agent-staging get job/enterprise-doc-embedding-rollout \
              -o wide || true
            kubectl -n enterprise-doc-agent-staging get pods \
              -l job-name=enterprise-doc-embedding-rollout -o wide || true
            kubectl -n enterprise-doc-agent-staging describe \
              job/enterprise-doc-embedding-rollout || true
            kubectl -n enterprise-doc-agent-staging describe pods \
              -l job-name=enterprise-doc-embedding-rollout || true
            exit 1
          fi
          kubectl -n enterprise-doc-agent-staging logs job/enterprise-doc-embedding-rollout \
            > "$report"
          "$RUNNER_PYTHON" scripts/validate_embedding_rollout_report.py \
            --input "$report" \
            --expected-model "$EXPECTED_EMBEDDING_MODEL" \
            --expected-version "$EXPECTED_EMBEDDING_VERSION"
          trap - EXIT
          restore_workloads
      - name: Run in-cluster readiness smoke
        id: cluster_smoke
        if: inputs.run_smoke
        run: |
          set -euo pipefail
          kubectl -n enterprise-doc-agent-staging delete job m5-staging-smoke --ignore-not-found
          kubectl apply -f infra/k8s/smoke/readiness-job.yaml
          kubectl -n enterprise-doc-agent-staging wait \
            --for=condition=complete job/m5-staging-smoke --timeout=120s
          kubectl -n enterprise-doc-agent-staging logs job/m5-staging-smoke
      - name: Clean up readiness smoke
        if: always() && inputs.run_smoke
        run: |
          kubectl -n enterprise-doc-agent-staging delete job m5-staging-smoke \
            --ignore-not-found --wait=true
      - name: Run authenticated upload to Agent smoke
        id: authenticated_smoke
        if: inputs.run_smoke
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
          STAGING_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_HOST }}
          STAGING_OBJECT_STORE_ALLOWED_HOST: ${{ vars.STAGING_OBJECT_STORE_ALLOWED_HOST }}
          STAGING_SMOKE_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
        run: |
          test -n "$STAGING_BASE_URL"
          test -n "$STAGING_ALLOWED_HOST"
          test -n "$STAGING_OBJECT_STORE_ALLOWED_HOST"
          test -n "$STAGING_SMOKE_TOKEN"
          "$RUNNER_PYTHON" scripts/staging_smoke.py \
            --base-url "$STAGING_BASE_URL" \
            --allowed-host "$STAGING_ALLOWED_HOST" \
            --allowed-object-store-host "$STAGING_OBJECT_STORE_ALLOWED_HOST" \
            --report-path "tmp/staging-smoke-${GITHUB_SHA}.json"
      - name: Restore tiny workloads after deployment attempt
        if: always()
        env:
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
        run: |
          set -euo pipefail
          if test "$DEPLOYMENT_PROFILE" != "tiny-single-node" && test "$DEPLOYMENT_PROFILE" != "single-node-4c4g"; then
            exit 0
          fi
          if test ! -f "$RUNNER_TEMP/staging-workloads.yaml"; then
            exit 0
          fi
          worker_timeout=600s
          if test "$DEPLOYMENT_PROFILE" = "single-node-4c4g"; then
            worker_timeout=1800s
          fi
          kubectl apply -f "$RUNNER_TEMP/staging-workloads.yaml" >/dev/null
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-api --timeout=600s
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-worker --timeout="$worker_timeout"
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-consumer --timeout=600s
          kubectl -n enterprise-doc-agent-staging rollout status deployment/enterprise-doc-web --timeout=600s
      - name: Collect sanitized release evidence
        if: always()
        env:
          REGISTRY_PREFIX: ${{ inputs.registry_prefix }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
          CONSUMER_DIGEST: ${{ inputs.consumer_digest }}
          WEB_DIGEST: ${{ inputs.web_digest }}
          RUN_SMOKE: ${{ inputs.run_smoke }}
          MODEL_PROVIDER: openai_compatible
          MODEL_BASE_URL: ${{ vars.STAGING_MODEL_BASE_URL }}
          MODEL_NAME: ${{ vars.STAGING_MODEL_NAME }}
          MODEL_FALLBACK_BASE_URL: ${{ vars.STAGING_MODEL_FALLBACK_BASE_URL }}
          MODEL_FALLBACK_NAME: ${{ vars.STAGING_MODEL_FALLBACK_NAME }}
          MODEL_FALLBACK_VERSION: ${{ vars.STAGING_MODEL_FALLBACK_VERSION }}
          MODEL_FALLBACK_TIMEOUT_SECONDS: ${{ vars.STAGING_MODEL_FALLBACK_TIMEOUT_SECONDS || '60' }}
          EMBEDDING_BASE_URL: ${{ vars.STAGING_EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL_NAME: ${{ vars.STAGING_EMBEDDING_MODEL_NAME }}
          EMBEDDING_VERSION: ${{ vars.STAGING_EMBEDDING_VERSION || '2' }}
          DEPLOYMENT_PROFILE: ${{ vars.STAGING_DEPLOYMENT_PROFILE || 'single-node-4c4g' }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          WORKLOADS_OUTCOME: ${{ steps.workloads.outcome }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
          EMBEDDING_ROLLOUT_OUTCOME: ${{ steps.embedding_rollout.outcome }}
          CLUSTER_SMOKE_OUTCOME: ${{ steps.cluster_smoke.outcome }}
          AUTHENTICATED_SMOKE_OUTCOME: ${{ steps.authenticated_smoke.outcome }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          evidence_id="${GITHUB_SHA}"
          raw_dir="tmp/staging-raw-${evidence_id}"
          sanitized_dir="tmp/staging-sanitized-${evidence_id}"
          mkdir -p "$raw_dir" "$sanitized_dir"
          trap 'rm -rf "$raw_dir"' EXIT
          : > "$raw_dir/collection-status.txt"
          capture() {
            name="$1"
            shift
            set +e
            "$@" > "$raw_dir/$name" 2>&1
            status=$?
            set -e
            printf '%s=%s\n' "$name" "$status" >> "$raw_dir/collection-status.txt"
          }
          for manifest in staging.yaml staging-prerequisites.yaml staging-migration.yaml staging-embedding-rollout.yaml staging-workloads.yaml; do
            if test -f "$RUNNER_TEMP/$manifest"; then
              cp "$RUNNER_TEMP/$manifest" "$raw_dir/staging-rendered-${manifest}"
            fi
          done
          if test -f "tmp/staging-smoke-${GITHUB_SHA}.json"; then
            cp "tmp/staging-smoke-${GITHUB_SHA}.json" "$raw_dir/staging-smoke.json"
          fi
          if test -f "$RUNNER_TEMP/staging-embedding-rollout.json"; then
            cp "$RUNNER_TEMP/staging-embedding-rollout.json" \
              "$raw_dir/staging-embedding-rollout.json"
          fi
          printf '%s\n' "$DEPLOYMENT_PROFILE" > "$raw_dir/deployment-profile.txt"
          capture deployments.json kubectl -n enterprise-doc-agent-staging get deploy -o json
          capture migration.log kubectl -n enterprise-doc-agent-staging logs job/enterprise-doc-migrate
          capture embedding-rollout-job.json kubectl -n enterprise-doc-agent-staging get \
            job/enterprise-doc-embedding-rollout -o json
          capture embedding-rollout.log kubectl -n enterprise-doc-agent-staging logs \
            job/enterprise-doc-embedding-rollout
          capture worker-current.log kubectl -n enterprise-doc-agent-staging logs \
            -l app.kubernetes.io/name=enterprise-doc-worker \
            --all-containers=true --prefix=true --tail=500
          capture worker-previous.log kubectl -n enterprise-doc-agent-staging logs \
            -l app.kubernetes.io/name=enterprise-doc-worker \
            --all-containers=true --prefix=true --tail=500 --previous=true
          capture consumer-current.log kubectl -n enterprise-doc-agent-staging logs \
            -l app.kubernetes.io/name=enterprise-doc-consumer \
            --all-containers=true --prefix=true --tail=500
          capture consumer-previous.log kubectl -n enterprise-doc-agent-staging logs \
            -l app.kubernetes.io/name=enterprise-doc-consumer \
            --all-containers=true --prefix=true --tail=500 --previous=true
          capture ingress.yaml kubectl -n enterprise-doc-agent-staging get ingress enterprise-doc-web -o yaml
          capture network-policy.yaml kubectl -n enterprise-doc-agent-staging get networkpolicy -o yaml
          capture events.txt kubectl -n enterprise-doc-agent-staging get events --sort-by=.lastTimestamp
          "$RUNNER_PYTHON" scripts/sanitize_deployment_evidence.py \
            --input-dir "$raw_dir" \
            --output-dir "$sanitized_dir" \
            --manifest "tmp/staging-evidence-${evidence_id}.manifest.json"
          image_digests_json="$("$RUNNER_PYTHON" -c 'import json, os; print(json.dumps({"api": os.environ["API_DIGEST"], "worker": os.environ["WORKER_DIGEST"], "consumer": os.environ["CONSUMER_DIGEST"], "web": os.environ["WEB_DIGEST"]}))')"
          outcomes_json="$("$RUNNER_PYTHON" -c 'import json, os; print(json.dumps({"prerequisites": os.environ["PREREQUISITES_OUTCOME"], "migration": os.environ["MIGRATION_OUTCOME"], "workloads": os.environ["WORKLOADS_OUTCOME"], "rollout": os.environ["ROLLOUT_OUTCOME"], "embedding_rollout": os.environ["EMBEDDING_ROLLOUT_OUTCOME"], "cluster_smoke": os.environ["CLUSTER_SMOKE_OUTCOME"], "authenticated_smoke": os.environ["AUTHENTICATED_SMOKE_OUTCOME"]}))')"
          fallback_record_args=()
          if test -n "$MODEL_FALLBACK_BASE_URL" || test -n "$MODEL_FALLBACK_NAME" || test -n "$MODEL_FALLBACK_VERSION"; then
            fallback_record_args+=(
              --fallback-model-base-url "$MODEL_FALLBACK_BASE_URL"
              --fallback-model-name "$MODEL_FALLBACK_NAME"
              --fallback-model-timeout-seconds "$MODEL_FALLBACK_TIMEOUT_SECONDS"
            )
            if test -n "$MODEL_FALLBACK_VERSION"; then
              fallback_record_args+=(--fallback-model-version "$MODEL_FALLBACK_VERSION")
            fi
          fi
          "$RUNNER_PYTHON" scripts/build_staging_release_record.py \
            --evidence-manifest "tmp/staging-evidence-${evidence_id}.manifest.json" \
            --deployment-profile "$DEPLOYMENT_PROFILE" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --registry-prefix "$REGISTRY_PREFIX" \
            --image-digests-json "$image_digests_json" \
            --outcomes-json "$outcomes_json" \
            --model-provider "$MODEL_PROVIDER" \
            --model-base-url "$MODEL_BASE_URL" \
            --model-name "$MODEL_NAME" \
            "${fallback_record_args[@]}" \
            --embedding-base-url "$EMBEDDING_BASE_URL" \
            --embedding-model-name "$EMBEDDING_MODEL_NAME" \
            --embedding-version "$EMBEDDING_VERSION" \
            --embedding-rollout-report "$sanitized_dir/staging-embedding-rollout.json" \
            --smoke-required "$RUN_SMOKE" \
            --output "tmp/staging-release-${evidence_id}.record.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-release-${{ github.sha }}
          path: |
            ${{ github.workspace }}/repository/tmp/staging-sanitized-${{ github.sha }}/
            ${{ github.workspace }}/repository/tmp/staging-evidence-${{ github.sha }}.manifest.json
            ${{ github.workspace }}/repository/tmp/staging-release-${{ github.sha }}.record.json
          if-no-files-found: error
      - name: Clean up cluster credentials
        if: always()
        run: rm -f "${KUBECONFIG:-$RUNNER_TEMP/enterprise-doc-kubeconfig-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"

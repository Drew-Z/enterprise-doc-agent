kind: ConfigMap
metadata:
  name: enterprise-doc-config
  namespace: enterprise-doc-agent-staging
---
apiVersion: v1
data:
  enterprise-doc-agent.rules.yml: "groups:\n  - name: enterprise-doc-agent-recordings\n\
    \    interval: 15s\n    rules:\n      - record: enterprise_doc:api_error_ratio5m\n\
    \        expr: |\n          sum(rate(enterprise_doc_api_requests_total{status_class=~\"\
    5xx\"}[5m]))\n          /\n          clamp_min(sum(rate(enterprise_doc_api_requests_total[5m])),\
    \ 1e-9)\n      - record: enterprise_doc:worker_failure_ratio5m\n        expr:\
    \ |\n          sum(rate(enterprise_doc_worker_jobs_completed_total{outcome=\"\
    failed\"}[5m]))\n          /\n          clamp_min(sum(rate(enterprise_doc_worker_jobs_completed_total[5m])),\
    \ 1e-9)\n      - record: enterprise_doc:outbox_error_ratio5m\n        expr: |\n\
    \          sum(rate(enterprise_doc_worker_outbox_publish_total{result=\"error\"\
    }[5m]))\n          /\n          clamp_min(sum(rate(enterprise_doc_worker_outbox_publish_total[5m])),\
    \ 1e-9)\n\n  - name: enterprise-doc-agent-alerts\n    interval: 15s\n    rules:\n\
    \      - alert: EnterpriseDocApiHighErrorRate\n        expr: enterprise_doc:api_error_ratio5m\
    \ > 0.05\n        for: 10m\n        labels:\n          severity: page\n      \
    \    service: enterprise-doc-api\n        annotations:\n          summary: API\
    \ 5xx error ratio is above 5 percent\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n      - alert: EnterpriseDocWorkerFailureRate\n        expr: enterprise_doc:worker_failure_ratio5m\
    \ > 0.1\n        for: 10m\n        labels:\n          severity: ticket\n     \
    \     service: enterprise-doc-worker\n        annotations:\n          summary:\
    \ Worker failure ratio is above 10 percent\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n      - alert: EnterpriseDocOutboxPublishErrors\n        expr: enterprise_doc:outbox_error_ratio5m\
    \ > 0\n        for: 5m\n        labels:\n          severity: ticket\n        \
    \  service: enterprise-doc-worker\n        annotations:\n          summary: Outbox\
    \ publication errors are present\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n      - alert: EnterpriseDocDependencyDown\n        expr: enterprise_doc_dependency_up\
    \ == 0\n        for: 5m\n        labels:\n          severity: page\n         \
    \ service: enterprise-doc-agent\n        annotations:\n          summary: A required\
    \ dependency health check is down\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n      - alert: EnterpriseDocMetricsTargetDown\n        expr: up{job=~\"enterprise-doc-(api|worker|consumer)\"\
    } == 0\n        for: 5m\n        labels:\n          severity: page\n         \
    \ service: enterprise-doc-prometheus\n        annotations:\n          summary:\
    \ An enterprise document metrics target is down\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n      - alert: EnterpriseDocMetricsTargetAbsent\n        expr: |\n         \
    \ absent(up{job=\"enterprise-doc-api\"})\n          or absent(up{job=\"enterprise-doc-worker\"\
    })\n          or absent(up{job=\"enterprise-doc-consumer\"})\n        for: 5m\n\
    \        labels:\n          severity: page\n          service: enterprise-doc-prometheus\n\
    \        annotations:\n          summary: An expected enterprise document metrics\
    \ target is absent\n          runbook: \"https://github.com/Drew-Z/enterprise-doc-agent/blob/main/docs/ops/staging-observability-and-capacity.md#alert-response\"\
    \n"
  prometheus.yml: "global:\n  scrape_interval: 15s\n  scrape_timeout: 5s\n  evaluation_interval:\
    \ 15s\n\nrule_files:\n  - /etc/prometheus/enterprise-doc-agent.rules.yml\n\nscrape_configs:\n\
    \  - job_name: enterprise-doc-api\n    metrics_path: /metrics\n    dns_sd_configs:\n\
    \      - names: [\"enterprise-doc-api-metrics.enterprise-doc-agent-staging.svc.cluster.local\"\
    ]\n        type: A\n        port: 8000\n        refresh_interval: 30s\n  - job_name:\
    \ enterprise-doc-worker\n    metrics_path: /metrics\n    dns_sd_configs:\n   \
    \   - names: [\"enterprise-doc-worker-metrics.enterprise-doc-agent-staging.svc.cluster.local\"\
    ]\n        type: A\n        port: 8081\n        refresh_interval: 30s\n  - job_name:\
    \ enterprise-doc-consumer\n    metrics_path: /metrics\n    dns_sd_configs:\n \
    \     - names: [\"enterprise-doc-consumer-metrics.enterprise-doc-agent-staging.svc.cluster.local\"\
    ]\n        type: A\n        port: 8082\n        refresh_interval: 30s\n"

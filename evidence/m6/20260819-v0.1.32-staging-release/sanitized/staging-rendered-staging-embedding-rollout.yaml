apiVersion: batch/v1
kind: Job
metadata:
  name: enterprise-doc-embedding-rollout
  namespace: enterprise-doc-agent-staging
spec:
  activeDeadlineSeconds: 1260
  backoffLimit: 0
  template:
    metadata:
      annotations:
        enterprise-doc-agent/config-sha256: bc7c69a854a6e35bd335d582dbb2b2015c91d8188f8f6117ad1b2e278a2e68fd
      labels:
        app.kubernetes.io/name: enterprise-doc-embedding-rollout
    spec:
      automountServiceAccountToken: '[REDACTED]'
      containers:
      - args:
        - --limit
        - '1000'
        - --deadline-seconds
        - '1200'
        - --poll-seconds
        - '5'
        command:
        - enterprise-doc-embedding-rollout
        envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef: '[REDACTED]'
        image: ghcr.io/drew-z/enterprise-doc-api@sha256:5472211ba8882ffa8ed60cffbe85aab94b2712cfece28f29d6b0271f0dbdb703
        name: embedding-rollout
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets: '[REDACTED]'
      restartPolicy: Never
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
  ttlSecondsAfterFinished: 86400

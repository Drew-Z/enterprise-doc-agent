            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
      imagePullSecrets: '[REDACTED]'
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault

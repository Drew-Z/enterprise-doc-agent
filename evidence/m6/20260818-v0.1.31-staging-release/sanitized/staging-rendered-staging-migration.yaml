apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: enterprise-doc-migrate
  namespace: enterprise-doc-agent-staging
spec:
  activeDeadlineSeconds: 2700
  backoffLimit: 3
  template:
    metadata:
      annotations:
        enterprise-doc-agent/config-sha256: 8bb05619a46540690780a03c41ef18a18ee153066bbd566121907ac29aacc327
      labels:
        app.kubernetes.io/name: enterprise-doc-migrate
    spec:
      containers:
      - command:
        - sh
        - -ec
        - 'alembic upgrade head

          enterprise-doc-checkpointer-setup --setup

          enterprise-doc-checkpointer-setup --check

          '
        envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef: '[REDACTED]'
        image: ghcr.io/drew-z/enterprise-doc-api@sha256:47374f763618e179da9b8cda8c993a13463fd48bf62c95e423924d7ed6a4471d
        name: migrate
        resources:
          limits:
            cpu: 750m
            memory: 512Mi
          requests:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets: '[REDACTED]'
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
  ttlSecondsAfterFinished: 86400

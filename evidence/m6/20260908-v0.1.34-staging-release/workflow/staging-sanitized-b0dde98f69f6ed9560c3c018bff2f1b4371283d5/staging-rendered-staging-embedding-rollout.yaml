apiVersion: batch/v1
kind: Job
metadata:
  name: enterprise-doc-embedding-rollout
  namespace: enterprise-doc-agent-staging
spec:
  activeDeadlineSeconds: 3060
  backoffLimit: 0
  template:
    metadata:
      annotations:
        enterprise-doc-agent/config-sha256: e802b8e7fa7179e77693b7ef9b2c17a473a61a2998d1f071fc6ddbf79e90114f
      labels:
        app.kubernetes.io/name: enterprise-doc-embedding-rollout
    spec:
      automountServiceAccountToken: '[REDACTED]'
      containers:
      - args:
        - --limit
        - '1000'
        - --deadline-seconds
        - '3000'
        - --poll-seconds
        - '5'
        command:
        - enterprise-doc-embedding-rollout
        envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef: '[REDACTED]'
        image: ghcr.io/drew-z/enterprise-doc-api@sha256:e2cbbc6ba1c5e7463ed21e6663c5a948d467e46bcd187a7cf8b02c50ed53bfff
        name: embedding-rollout
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets: '[REDACTED]'
      restartPolicy: Never
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
  ttlSecondsAfterFinished: 86400

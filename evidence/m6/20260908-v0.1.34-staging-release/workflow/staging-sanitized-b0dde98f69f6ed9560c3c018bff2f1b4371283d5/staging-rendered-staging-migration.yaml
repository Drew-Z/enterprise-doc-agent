apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: enterprise-doc-migrate
  namespace: enterprise-doc-agent-staging
spec:
  activeDeadlineSeconds: 2700
  backoffLimit: 3
  template:
    metadata:
      annotations:
        enterprise-doc-agent/config-sha256: e802b8e7fa7179e77693b7ef9b2c17a473a61a2998d1f071fc6ddbf79e90114f
      labels:
        app.kubernetes.io/name: enterprise-doc-migrate
    spec:
      containers:
      - command:
        - sh
        - -ec
        - 'alembic upgrade head

          enterprise-doc-checkpointer-setup --setup

          enterprise-doc-checkpointer-setup --check

          '
        envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef: '[REDACTED]'
        image: ghcr.io/drew-z/enterprise-doc-api@sha256:e2cbbc6ba1c5e7463ed21e6663c5a948d467e46bcd187a7cf8b02c50ed53bfff
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets: '[REDACTED]'
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
  ttlSecondsAfterFinished: 86400

apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: enterprise-doc-agent
  name: enterprise-doc-agent-staging
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: enterprise-doc-runtime
  namespace: enterprise-doc-agent-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-doc-runtime
  namespace: enterprise-doc-agent-staging
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enterprise-doc-runtime
  namespace: enterprise-doc-agent-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enterprise-doc-runtime
subjects:
- kind: ServiceAccount
  name: enterprise-doc-runtime
  namespace: enterprise-doc-agent-staging
---
apiVersion: v1
data:
  API__HOST: 0.0.0.0
  API__PORT: "8000"
  APP_ENV: staging
  LOG_LEVEL: INFO
  OBJECT_STORE__ARTIFACTS_BUCKET: artifacts
  OBJECT_STORE__DOCUMENTS_BUCKET: documents
  OBJECT_STORE__ENDPOINT: http://minio:9000
  OBJECT_STORE__PRESIGN_ENDPOINT: http://minio:9000
  OBJECT_STORE__SECURE: "false"
  OTEL__ENABLED: "true"
  OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL__METRICS_ENABLED: "true"
  REDIS__URL: redis://redis:6379/0
  WORKER__CONSUMER_METRICS_PORT: "8082"
  WORKER__HOST: 0.0.0.0
  WORKER__PROBE_PORT: "8081"
kind: ConfigMap
metadata:
  name: enterprise-doc-config
  namespace: enterprise-doc-agent-staging
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-api
  namespace: enterprise-doc-agent-staging
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/name: enterprise-doc-api
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-consumer
  namespace: enterprise-doc-agent-staging
spec:
  ports:
  - name: metrics
    port: 8082
    targetPort: metrics
  selector:
    app.kubernetes.io/name: enterprise-doc-consumer
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-web
  namespace: enterprise-doc-agent-staging
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: enterprise-doc-web
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-worker
  namespace: enterprise-doc-agent-staging
spec:
  ports:
  - name: probe
    port: 8081
    targetPort: probe
  selector:
    app.kubernetes.io/name: enterprise-doc-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: enterprise-doc-api
    app.kubernetes.io/part-of: enterprise-doc-agent
  name: enterprise-doc-api
  namespace: enterprise-doc-agent-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-api
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef:
            name: enterprise-doc-secrets
        image: registry.example.invalid/enterprise-doc/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: enterprise-doc-consumer
    app.kubernetes.io/part-of: enterprise-doc-agent
  name: enterprise-doc-consumer
  namespace: enterprise-doc-agent-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-consumer
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef:
            name: enterprise-doc-secrets
        image: registry.example.invalid/enterprise-doc/consumer@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        livenessProbe:
          periodSeconds: 10
          tcpSocket:
            port: metrics
        name: consumer
        ports:
        - containerPort: 8082
          name: metrics
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: metrics
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          periodSeconds: 5
          tcpSocket:
            port: metrics
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: enterprise-doc-web
    app.kubernetes.io/part-of: enterprise-doc-agent
  name: enterprise-doc-web
  namespace: enterprise-doc-agent-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-web
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      containers:
      - image: registry.example.invalid/enterprise-doc/web@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
        name: web
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: enterprise-doc-worker
    app.kubernetes.io/part-of: enterprise-doc-agent
  name: enterprise-doc-worker
  namespace: enterprise-doc-agent-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-worker
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef:
            name: enterprise-doc-secrets
        image: registry.example.invalid/enterprise-doc/worker@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        livenessProbe:
          httpGet:
            path: /health/live
            port: probe
          periodSeconds: 10
        name: worker
        ports:
        - containerPort: 8081
          name: probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: probe
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: probe
          periodSeconds: 5
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-doc-api
  namespace: enterprise-doc-agent-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-doc-consumer
  namespace: enterprise-doc-agent-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-consumer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-doc-web
  namespace: enterprise-doc-agent-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-doc-worker
  namespace: enterprise-doc-agent-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-worker
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: enterprise-doc-migrate
  namespace: enterprise-doc-agent-staging
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-migrate
    spec:
      containers:
      - command:
        - alembic
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: enterprise-doc-config
        - secretRef:
            name: enterprise-doc-secrets
        image: registry.example.invalid/enterprise-doc/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: enterprise-doc-runtime
  ttlSecondsAfterFinished: 86400
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-api-ingress
  namespace: enterprise-doc-agent-staging
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: enterprise-doc-web
    - namespaceSelector: {}
    ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-api
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-default-deny
  namespace: enterprise-doc-agent-staging
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-runtime-egress
  namespace: enterprise-doc-agent-staging
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    - port: 6379
      protocol: TCP
    - port: 9000
      protocol: TCP
    - port: 4318
      protocol: TCP
    - port: 8000
      protocol: TCP
    to:
    - namespaceSelector: {}
  podSelector: {}
  policyTypes:
  - Egress

name: enterprise-doc-agent
services:
  grafana:
    profiles:
      - observability
    depends_on:
      prometheus:
        condition: service_started
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: enterprise_doc_local
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    image: grafana/grafana:12.1.1
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: D:\workspace4Cursor\enterprise-doc-agent\infra\observability\grafana\provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind: {}
      - type: bind
        source: D:\workspace4Cursor\enterprise-doc-agent\infra\observability\grafana\dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind: {}
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
        volume: {}
  minio:
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      MINIO_ROOT_PASSWORD: enterprise_doc_local_secret
      MINIO_ROOT_USER: enterprise_doc_local
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      timeout: 3s
      interval: 3s
      retries: 20
      start_period: 5s
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    networks:
      default: null
    ports:
      - mode: ingress
        target: 9000
        published: "9000"
        protocol: tcp
      - mode: ingress
        target: 9001
        published: "9001"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: minio-data
        target: /data
        volume: {}
  postgres:
    environment:
      POSTGRES_DB: enterprise_doc
      POSTGRES_PASSWORD: enterprise_doc_local
      POSTGRES_USER: enterprise_doc
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      timeout: 3s
      interval: 3s
      retries: 20
      start_period: 5s
    image: pgvector/pgvector:pg16
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        volume: {}
  prometheus:
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - host.docker.internal=host-gateway
    image: prom/prometheus:v3.5.0
    networks:
      default: null
    ports:
      - mode: ingress
        target: 9090
        published: "9090"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: D:\workspace4Cursor\enterprise-doc-agent\infra\observability\prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind: {}
      - type: volume
        source: prometheus-data
        target: /prometheus
        volume: {}
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 3s
      retries: 20
    image: redis:7.4-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis-data
        target: /data
        volume: {}
networks:
  default:
    name: enterprise-doc-agent_default
volumes:
  grafana-data:
    name: enterprise-doc-agent_grafana-data
  minio-data:
    name: enterprise-doc-agent_minio-data
  postgres-data:
    name: enterprise-doc-agent_postgres-data
  prometheus-data:
    name: enterprise-doc-agent_prometheus-data
  redis-data:
    name: enterprise-doc-agent_redis-data

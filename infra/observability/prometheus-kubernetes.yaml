apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enterprise-doc-prometheus-data
  labels:
    app.kubernetes.io/name: enterprise-doc-prometheus
    app.kubernetes.io/part-of: enterprise-doc-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-prometheus
  labels:
    app.kubernetes.io/name: enterprise-doc-prometheus
    app.kubernetes.io/part-of: enterprise-doc-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: enterprise-doc-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-prometheus
  labels:
    app.kubernetes.io/name: enterprise-doc-prometheus
    app.kubernetes.io/part-of: enterprise-doc-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-prometheus
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=4GB
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: storage, mountPath: /prometheus}
      volumes:
        - name: config
          configMap:
            name: enterprise-doc-prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: enterprise-doc-prometheus-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-prometheus-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-api
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-worker
      ports:
        - {protocol: TCP, port: 8081}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-consumer
      ports:
        - {protocol: TCP, port: 8082}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-api-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-prometheus
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-worker-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-prometheus
      ports:
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-consumer-metrics-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-consumer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-prometheus
      ports:
        - {protocol: TCP, port: 8082}

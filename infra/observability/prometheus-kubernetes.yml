global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/enterprise-doc-agent.rules.yml

scrape_configs:
  - job_name: enterprise-doc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["enterprise-doc-api:8000"]
  - job_name: enterprise-doc-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["enterprise-doc-worker:8081"]
  - job_name: enterprise-doc-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["enterprise-doc-consumer:8082"]

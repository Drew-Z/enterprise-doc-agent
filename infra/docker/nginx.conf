server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Request-ID $request_id always;
  proxy_hide_header X-Request-ID;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /auth/ {
    # Authorization codes and state must never enter a query-bearing access log.
    access_log off;
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location = /health/live {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"alive"}';
  }

  location = /health/ready {
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/ {
    # Presales rows have a bounded application deadline of at most 180 seconds.
    # Preserve its typed result instead of replacing it with nginx's default 60s 504.
    proxy_read_timeout 210s;
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}

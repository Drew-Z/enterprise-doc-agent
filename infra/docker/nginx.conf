# Error responses need an explicit policy; otherwise a CDN may cache a 404.
map $status $fingerprinted_asset_cache_control {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Request-ID $request_id always;
  proxy_hide_header X-Request-ID;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /auth/ {
    # Authorization codes and state must never enter a query-bearing access log.
    access_log off;
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location = /health/live {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"alive"}';
  }

  location = /health/ready {
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /api/ {
    # Presales rows have a bounded application deadline of at most 180 seconds.
    # Preserve its typed result instead of replacing it with nginx's default 60s 504.
    proxy_read_timeout 210s;
    proxy_pass http://enterprise-doc-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Vite fingerprints these public files; a new build receives a new URL.
  # Keep HTML, unversioned files and authenticated responses outside this cache.
  location ~ "^/assets/[A-Za-z0-9_.-]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control $fingerprinted_asset_cache_control always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Request-ID $request_id always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript;
  }

  location / {
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}

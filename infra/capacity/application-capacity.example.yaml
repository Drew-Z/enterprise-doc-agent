schema_version: 1
scenario: ready
base_url: https://staging.example.com
repetitions: 2
target_p95_ms: 250
token_env: ENTERPRISE_DOC_LOAD_TOKEN
request_timeout_seconds: 30
terminal_timeout_seconds: 120
poll_seconds: 0.25
resource_sample_interval_seconds: 0.25
phases:
  - name: ramp
    requests: 100
    concurrency: 5
  - name: steady_state
    requests: 1000
    concurrency: 20
  - name: burst
    requests: 500
    concurrency: 50
  - name: recovery
    requests: 200
    concurrency: 10
prometheus:
  base_url: https://prometheus.staging.example.com
  bearer_token_env: ENTERPRISE_DOC_PROMETHEUS_TOKEN
  step_seconds: 5
  queries:
    # single-node-4c8g limits: API 2x750m, Worker 1000m, Consumer 750m.
    cpu: 100 * sum(rate(process_cpu_seconds_total{job=~"enterprise-doc-(api|worker|consumer)"}[1m])) / 3.25
    # single-node-4c8g limits: API 2x768Mi, Worker 1Gi, Consumer 768Mi.
    memory: 100 * sum(process_resident_memory_bytes{job=~"enterprise-doc-(api|worker|consumer)"}) / (3.25 * 1024 * 1024 * 1024)
    database_pool: max(enterprise_doc_database_pool_utilization_percent)
    queue: max(enterprise_doc_queue_oldest_age_seconds)
    redis: max(enterprise_doc_redis_connections)
    object_store: histogram_quantile(0.95, sum(rate(enterprise_doc_dependency_duration_seconds_bucket{dependency="object_store"}[1m])) by (le))
    model: histogram_quantile(0.95, sum(rate(enterprise_doc_dependency_duration_seconds_bucket{dependency="model"}[1m])) by (le))

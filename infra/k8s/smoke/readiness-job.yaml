apiVersion: batch/v1
kind: Job
metadata:
  name: m5-staging-smoke
  namespace: enterprise-doc-agent-staging
  labels:
    app.kubernetes.io/name: m5-staging-smoke
    app.kubernetes.io/part-of: enterprise-doc-agent
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m5-staging-smoke
        app.kubernetes.io/part-of: enterprise-doc-agent
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: readiness
          image: curlimages/curl@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
          command:
            - sh
            - -ec
            - curl --fail --silent http://enterprise-doc-api:8000/health/ready
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi

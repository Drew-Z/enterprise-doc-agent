apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-redis-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-worker
      ports:
        - {protocol: TCP, port: 6379}


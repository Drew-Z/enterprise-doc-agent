apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-redis
  labels: &redis-labels
    app.kubernetes.io/name: enterprise-doc-redis
    app.kubernetes.io/part-of: enterprise-doc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels: *redis-labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 48mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 100m, memory: 96Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-doc-redis
spec:
  selector:
    app.kubernetes.io/name: enterprise-doc-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis


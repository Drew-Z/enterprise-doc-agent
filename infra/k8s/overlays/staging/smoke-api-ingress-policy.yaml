apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-staging-smoke-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enterprise-doc-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: m5-staging-smoke
      ports:
        - {protocol: TCP, port: 8000}

apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-doc-config
data:
  DATABASE__CONNECT_TIMEOUT_SECONDS: "15"
  DATABASE__POOL_SIZE: "3"
  DATABASE__MAX_OVERFLOW: "2"
  DATABASE__POOL_TIMEOUT_SECONDS: "10"
  DATABASE__POOL_RECYCLE_SECONDS: "600"
  OBJECT_STORE__CONNECT_TIMEOUT_SECONDS: "15"
  AGENT__CHECKPOINT_TIMEOUT_SECONDS: "60"
  OBJECT_STORE__ENDPOINT: https://objects.example.invalid
  OBJECT_STORE__PRESIGN_ENDPOINT: https://objects.example.invalid
  OBJECT_STORE__SECURE: "true"
  MODEL__PROVIDER: openai_compatible
  MODEL__BASE_URL: https://model.example.invalid/v1
  MODEL__MODEL_NAME: replace-with-reviewed-model
  MODEL__TIMEOUT_SECONDS: "60"

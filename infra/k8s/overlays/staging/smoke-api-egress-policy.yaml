apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-staging-smoke-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: m5-staging-smoke
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enterprise-doc-api
      ports:
        - {protocol: TCP, port: 8000}

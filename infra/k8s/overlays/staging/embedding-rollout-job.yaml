apiVersion: batch/v1
kind: Job
metadata:
  name: enterprise-doc-embedding-rollout
spec:
  activeDeadlineSeconds: 1260
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-doc-embedding-rollout
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      serviceAccountName: enterprise-doc-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: embedding-rollout
          image: enterprise-doc/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          command: [enterprise-doc-embedding-rollout]
          args:
            - --limit
            - "1000"
            - --deadline-seconds
            - "1200"
            - --poll-seconds
            - "5"
          envFrom:
            - configMapRef: {name: enterprise-doc-config}
            - secretRef: {name: enterprise-doc-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

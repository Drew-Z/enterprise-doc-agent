apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 400m, memory: 224Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 192Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-consumer
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: consumer
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 400m, memory: 192Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-doc-web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enterprise-doc-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 250m, memory: 160Mi}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-doc-recovery-postgres-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - enterprise-doc-api
          - enterprise-doc-worker
          - enterprise-doc-consumer
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 5432}

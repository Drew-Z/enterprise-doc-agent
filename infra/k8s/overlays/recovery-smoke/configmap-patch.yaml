apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-doc-config
data:
  DATABASE__CONNECT_TIMEOUT_SECONDS: "15"
  DATABASE__POOL_SIZE: "2"
  DATABASE__MAX_OVERFLOW: "1"
  DATABASE__POOL_TIMEOUT_SECONDS: "10"
  DATABASE__POOL_RECYCLE_SECONDS: "600"
  REDIS__URL: redis://enterprise-doc-redis:6379/0
  OBJECT_STORE__ENDPOINT: https://objects.example.invalid
  OBJECT_STORE__PRESIGN_ENDPOINT: https://objects.example.invalid
  OBJECT_STORE__DOCUMENTS_BUCKET: replace-with-recovery-documents-bucket
  OBJECT_STORE__ARTIFACTS_BUCKET: replace-with-recovery-artifacts-bucket
  OBJECT_STORE__SECURE: "true"
  OBJECT_STORE__MULTIPART_CHECKSUM_MODE: readback_sha256
  OBJECT_STORE__CONNECT_TIMEOUT_SECONDS: "15"
  MODEL__PROVIDER: openai_compatible
  MODEL__BASE_URL: https://model.example.invalid/v1
  MODEL__MODEL_NAME: replace-with-reviewed-model
  MODEL__TIMEOUT_SECONDS: "60"
  EMBEDDING__PROVIDER: openai_compatible
  EMBEDDING__BASE_URL: https://embedding.example.invalid/v1
  EMBEDDING__MODEL_NAME: replace-with-reviewed-embedding-model
  EMBEDDING__DIMENSION: "1024"
  EMBEDDING__VERSION: "2"
  EMBEDDING__BATCH_SIZE: "8"
  EMBEDDING__TIMEOUT_SECONDS: "20"
  EMBEDDING__MAX_RETRIES: "2"
  EMBEDDING__SEND_DIMENSIONS: "true"
  EMBEDDING__QUERY_INSTRUCTION: >-
    Given a user question about enterprise documents, retrieve relevant passages that answer the question


apiVersion: v1
kind: Secret
metadata:
  name: enterprise-doc-secrets
type: Opaque
stringData:
  DATABASE__URL: replace-with-secret-manager-reference
  DATABASE__PASSWORD: replace-with-secret-manager-reference
  MCP__DATABASE_URL: replace-with-transaction-pooler-secret-manager-reference
  OBJECT_STORE__ACCESS_KEY: replace-with-secret-manager-reference
  OBJECT_STORE__SECRET_KEY: replace-with-secret-manager-reference
  AUTH__SIGNING_KEY: replace-with-secret-manager-reference
  # Secret Manager must inject this as a JSON object mapping tenant UUIDs to
  # high-entropy SCIM bearer tokens; keep the example parseable when disabled.
  AUTH__SCIM_TENANT_TOKENS: '{}'
  MCP__SIGNING_SECRET: replace-with-secret-manager-reference
  MODEL__API_KEY: replace-with-secret-manager-reference
  MODEL__FALLBACK_API_KEY: replace-with-secret-manager-reference
  EMBEDDING__API_KEY: replace-with-secret-manager-reference

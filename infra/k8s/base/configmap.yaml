apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-doc-config
data:
  APP_ENV: staging
  LOG_LEVEL: INFO
  REDIS__URL: redis://redis:6379/0
  OBJECT_STORE__ENDPOINT: http://minio:9000
  OBJECT_STORE__PRESIGN_ENDPOINT: http://minio:9000
  OBJECT_STORE__DOCUMENTS_BUCKET: documents
  OBJECT_STORE__ARTIFACTS_BUCKET: artifacts
  OBJECT_STORE__SECURE: "false"
  OBJECT_STORE__MULTIPART_CHECKSUM_MODE: native_sha256
  # Document analysis is deployed dark. Enable structured uploads first, then
  # execution only for a reviewed route, budget and evaluation window.
  UPLOAD__STRUCTURED_DOCUMENTS_ENABLED: "false"
  ANALYSIS__EXECUTION_ENABLED: "false"
  ANALYSIS__UNIT_DEADLINE_SECONDS: "120"
  ANALYSIS__RUN_DEADLINE_SECONDS: "3600"
  ANALYSIS__MAX_INPUT_BYTES: "65536"
  MODEL__ROUTE_ID: default
  # Enable only after a reviewed collector or managed OTLP endpoint is provisioned.
  OTEL__ENABLED: "false"
  OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL__METRICS_ENABLED: "true"
  API__HOST: 0.0.0.0
  API__PORT: "8000"
  API__READINESS_CACHE_TTL_SECONDS: "2"
  # External OIDC is disabled until the IdP, provisioning and end-to-end
  # acceptance gates are reviewed. Configure issuer/audience/JWKS together.
  AUTH__EXTERNAL_AUTH_ENABLED: "false"
  # Role claims are opt-in. Group mappings are explicit and must not overlap;
  # ambiguous owner/member claims are rejected by the API.
  AUTH__EXTERNAL_ROLE_CLAIM_ENABLED: "false"
  AUTH__EXTERNAL_OWNER_GROUPS: '["owner", "tenant-owner"]'
  AUTH__EXTERNAL_MEMBER_GROUPS: '["member", "tenant-member"]'
  # SCIM is disabled by default. Tenant tokens belong in Secret Manager.
  AUTH__SCIM_ENABLED: "false"
  AUTH__SCIM_ISSUER: https://idp.example.test/scim
  AUTH__SCIM_TENANT_TOKENS: '{}'
  WORKER__HOST: 0.0.0.0
  WORKER__PROBE_PORT: "8081"
  WORKER__CONSUMER_METRICS_PORT: "8082"
  EMBEDDING__PROVIDER: openai_compatible
  EMBEDDING__BASE_URL: https://embedding.example.invalid/v1
  EMBEDDING__MODEL_NAME: replace-with-reviewed-embedding-model
  EMBEDDING__DIMENSION: "1024"
  EMBEDDING__VERSION: "2"
  EMBEDDING__BATCH_SIZE: "8"
  EMBEDDING__TIMEOUT_SECONDS: "20"
  EMBEDDING__MAX_RETRIES: "2"
  EMBEDDING__INGESTION_MAX_ATTEMPTS: "3"
  EMBEDDING__SEND_DIMENSIONS: "true"
  EMBEDDING__QUERY_INSTRUCTION: >-
    Given a user question about enterprise documents, retrieve relevant passages that answer the question
  RETRIEVAL__REQUIRE_VECTOR_EVIDENCE: "false"
